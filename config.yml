# ============================================================
# 个人主页配置文件
# 修改本文件即可更新页面内容，无需改动 index.html
# 图标名称参考 Font Awesome 6：https://fontawesome.com/search
#   品牌图标：fa-brands fa-github / fa-weixin / fa-bilibili
#   通用图标：fa-solid fa-envelope / fa-link
# ============================================================

# ---------- 站点信息 ----------
site:
  title: "Wolffy1998 的主页"
  slogan: "代码与像素，都是热爱"
  footer: "© 2026 Wolffy1998 · Powered by GitHub Pages"
  # 主题色（用于按钮、链接、高亮、渐变等），支持任意 CSS 颜色值
  accent: "#3b82f6"

# ---------- 个人信息 ----------
profile:
  name: "Wolffy1998"
  # 头像：文件放在项目根目录，文件名和后缀都在这里定义（如 avatar.png / avatar.webp）
  # 也可直接填在线图片 URL；不配置时显示姓名首字作为默认头像
  avatar: "avatar.jpg"
  title: "Java 开发工程师 · 怀旧游戏爱好者"
  # 个人简介，支持多行
  bio: |
    一名 Java 后端开发工程师，日常与 Spring Boot、MySQL 打交道。
    工作之外是一名怀旧游戏爱好者，喜欢折腾老游戏机、模拟器与复古像素风，
    偶尔也会用代码复刻一些童年经典小游戏。
  location: "中国"
  # 技能标签（随意增删）
  skills:
    - "Java"
    - "Spring Boot"
    - "MySQL"
    - "Redis"
    - "Linux"
    - "Docker"

# ---------- 项目展示 ----------
# 按需增删条目，字段：
#   name / description / link（在线地址）/ repo（仓库地址，不配则不显示源码按钮）/ icon / tags
projects:
  # ↓↓↓ 以下 8 条为测试数据（重复内容），用于验证多卡片布局，上线前请替换成真实项目
  - name: "个人主页"
    description: "本站。由 config.yml 驱动的静态主页，部署在 GitHub Pages。"
    link: "https://wolffy1998.github.io"
    repo: "https://github.com/wolffy1998/wolffy1998.github.io"
    icon: "fa-solid fa-house"
    tags: ["HTML", "GitHub Pages"]

  - name: "MAME-SL 游戏列表编辑器"
    description: "MAME-SL 游戏列表编辑器。"
    link: "https://wolffy1998.github.io/MAME-SL-GameList/"
    repo: "https://github.com/wolffy1998/MAME-SL-GameList"
    icon: "fa-solid fa-house"
    tags: ["HTML", "GitHub Pages"]

