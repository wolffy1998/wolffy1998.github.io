# ============================================================
# 个人主页配置文件
# 修改本文件即可更新页面内容，无需改动 index.html
# 图标名称参考 Font Awesome 6：https://fontawesome.com/search
#   品牌图标：fa-brands fa-github / fa-weixin / fa-bilibili
#   通用图标：fa-solid fa-envelope / fa-link
# ============================================================

# ---------- 站点信息 ----------
site:
  title: "Wolffy1998 的主页"
  slogan: "代码与像素，都是热爱"
  footer: "© 2026 Wolffy1998 · Powered by GitHub Pages"
  # 主题色（用于按钮、链接、高亮、渐变等），支持任意 CSS 颜色值
  accent: "#7c6cf6"

# ---------- 个人信息 ----------
profile:
  name: "Wolffy1998"
  # 头像：可填写在线图片 URL，或使用项目内相对路径
  avatar: "assets/touxiang.jpg"
  title: "Java 开发工程师 · 怀旧游戏爱好者"
  # 个人简介，支持多行
  bio: |
    一名 Java 后端开发工程师，日常与 Spring Boot、MySQL 打交道。
    工作之外是一名怀旧游戏爱好者，喜欢折腾老游戏机、模拟器与复古像素风，
    偶尔也会用代码复刻一些童年经典小游戏。
  location: "中国"
  # 技能标签（随意增删）
  skills:
    - "Java"
    - "Spring Boot"
    - "MySQL"
    - "Redis"
    - "Linux"
    - "Docker"

# ---------- 项目展示 ----------
# 按需增删条目，字段：
#   name / description / link（在线地址）/ repo（仓库地址）/ icon / tags / highlight
projects:
  - name: "个人主页"
    description: "本站。由 config.yml 驱动的静态主页，部署在 GitHub Pages。"
    link: "https://wolffy1998.github.io"
    repo: "https://github.com/wolffy1998/wolffy1998.github.io"
    icon: "fa-solid fa-house"
    tags: ["HTML", "GitHub Pages"]
    highlight: true

  # ↓ 参考模板：复制粘贴后改成你自己的项目，不需要就删掉或整段注释
  # - name: "项目名称"
  #   description: "一句话项目简介。"
  #   link: "https://项目在线地址"
  #   repo: "https://github.com/wolffy1998/仓库名"
  #   icon: "fa-solid fa-cube"
  #   tags: ["Java", "Spring Boot"]

# ---------- 联系方式 ----------
# 字段：label 显示名称 / value 显示内容 / link 点击跳转（可选）/ icon 图标
contacts:
  - label: "GitHub"
    value: "@wolffy1998"
    link: "https://github.com/wolffy1998"
    icon: "fa-brands fa-github"

  - label: "邮箱"
    value: "wolffy1998@example.com"
    link: "mailto:wolffy1998@example.com"
    icon: "fa-solid fa-envelope"

  - label: "微信公众号"
    value: "公众号名称"
    icon: "fa-brands fa-weixin"

  - label: "哔哩哔哩"
    value: "@Wolffy1998"
    link: "https://space.bilibili.com/xxxxx"
    icon: "fa-brands fa-bilibili"
