<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>个人主页</title>
  <meta name="description" content="个人主页 - 关于我、项目与联系方式" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <meta name="theme-color" content="#0b1020" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  <style>
    :root {
      --accent: #3b82f6;
      --accent-2: #38bdf8;
      --grad: linear-gradient(135deg, var(--accent), var(--accent-2));
      --bg: #0b1020;
      --card: #131a2e;
      --text: #e6eaf2;
      --text-2: #8b94a7;
      --line: #242e47;
      --mono: "JetBrains Mono", "Cascadia Code", Consolas, monospace;
      --radius: 14px;
      --shadow: 0 8px 28px rgba(2, 6, 23, 0.55);
      --shadow-hover: 0 16px 40px rgba(2, 6, 23, 0.65);
      --glow: 0 0 0 1px color-mix(in srgb, var(--accent) 35%, transparent),
              0 12px 32px color-mix(in srgb, var(--accent) 18%, transparent);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      font-family: "PingFang SC", "HarmonyOS Sans SC", "Microsoft YaHei", "Segoe UI", -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.75;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }
    .container { max-width: 960px; margin: 0 auto; padding: 0 24px; }

    /* ---------- 背景装饰：细网格 + 角落光晕 ---------- */
    body::before {
      content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
      background:
        radial-gradient(600px 420px at 85% -5%, color-mix(in srgb, var(--accent) 14%, transparent), transparent 70%),
        radial-gradient(520px 380px at -10% 105%, color-mix(in srgb, var(--accent-2) 10%, transparent), transparent 70%),
        linear-gradient(rgba(255,255,255,0.028) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.028) 1px, transparent 1px);
      background-size: auto, auto, 48px 48px, 48px 48px;
    }

    /* ---------- 顶部导航 ---------- */
    header {
      position: sticky; top: 0; z-index: 10;
      background: rgba(11, 16, 32, 0.82);
      backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--line);
    }
    nav { display: flex; align-items: center; justify-content: space-between; height: 64px; }
    nav .logo {
      font-weight: 700; font-size: 17px; color: var(--text); text-decoration: none;
      letter-spacing: .5px;
    }
    nav ul { display: flex; gap: 8px; list-style: none; }
    nav ul a {
      color: var(--text-2); text-decoration: none; font-size: 14.5px;
      padding: 6px 14px; border-radius: 8px; transition: all .25s;
      border: 1px solid transparent;
    }
    nav ul a:hover { color: var(--accent); border-color: var(--line); background: var(--card); }

    /* ---------- Hero ---------- */
    .hero { padding: 76px 0 40px; text-align: center; }
    .avatar-ring {
      width: 132px; height: 132px; margin: 0 auto 22px; border-radius: 50%;
      padding: 3px; background: var(--grad);
      box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.12), 0 14px 34px rgba(2, 6, 23, 0.6);
    }
    .avatar-ring img,
    .avatar-ring .avatar-fallback {
      width: 100%; height: 100%; border-radius: 50%; object-fit: cover;
      border: 4px solid var(--bg); background: var(--accent);
      color: #fff; font-size: 46px; font-weight: 700;
      display: flex; align-items: center; justify-content: center;
      user-select: none;
    }
    .hero h1 {
      font-size: clamp(28px, 6vw, 40px); letter-spacing: 1px; font-weight: 800;
      background: var(--grad);
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .hero .wave { display: inline-block; animation: wave 2.4s infinite; transform-origin: 70% 70%; }
    .job-pill {
      display: inline-flex; align-items: center; gap: 8px;
      margin: 12px 0 0; padding: 6px 18px; border-radius: 10px;
      background: var(--card); border: 1px solid var(--line);
      color: var(--text); font-size: 15px; font-weight: 600;
    }
    .job-pill i { color: var(--accent); }
    .hero .location { color: var(--text-2); font-size: 13.5px; margin-top: 10px; font-family: var(--mono); }
    .hero .location i { margin-right: 5px; color: var(--accent); }
    .hero .bio {
      max-width: 600px; margin: 16px auto 0; color: var(--text-2);
      white-space: pre-line; font-size: 15.5px;
    }
    .skills { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 26px; }
    .skill {
      font-family: var(--mono); font-size: 12.5px;
      background: transparent; border: 1px solid var(--line); border-radius: 8px;
      padding: 4px 14px; color: var(--text-2); transition: all .25s;
    }
    .skill:hover { border-color: var(--accent); color: var(--accent); }
    @keyframes wave { 0%,60%,100% { transform: rotate(0); } 10%,30% { transform: rotate(18deg); } 20% { transform: rotate(-8deg); } }

    /* ---------- 区块 ---------- */
    section { padding: 44px 0; }
    .section-title { display: flex; align-items: center; gap: 14px; margin-bottom: 26px; }
    .section-title .st-icon {
      width: 42px; height: 42px; border-radius: 10px; flex-shrink: 0;
      background: var(--card); border: 1px solid var(--line);
      color: var(--accent); font-size: 17px;
      display: flex; align-items: center; justify-content: center;
    }
    .section-title h2 { font-size: 20px; letter-spacing: 1px; }
    .section-title .st-line { flex: 1; height: 1px; background: var(--line); }

    /* ---------- 项目卡片 ---------- */
    .projects-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 20px; }
    .project {
      background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
      padding: 24px; position: relative; overflow: hidden;
      display: flex; flex-direction: column; gap: 12px;
      transition: transform .3s ease, box-shadow .3s ease, border-color .3s ease;
    }
    .project:hover { transform: translateY(-6px); border-color: color-mix(in srgb, var(--accent) 45%, transparent); box-shadow: var(--glow); }
    .project::before {
      content: ""; position: absolute; inset: 0 0 auto 0; height: 3px;
      background: var(--grad); opacity: 0; transition: opacity .3s;
    }
    .project:hover::before { opacity: 1; }
    .p-head { display: flex; align-items: center; gap: 14px; }
    .p-icon {
      width: 46px; height: 46px; border-radius: 10px; flex-shrink: 0;
      background: color-mix(in srgb, var(--accent) 14%, transparent);
      border: 1px solid color-mix(in srgb, var(--accent) 25%, transparent);
      color: var(--accent); font-size: 19px;
      display: flex; align-items: center; justify-content: center;
    }
    .p-title {
      font-size: 17px; font-weight: 700; color: var(--text);
      text-decoration: none; transition: color .2s;
      display: inline-flex; align-items: center; gap: 8px; flex-wrap: wrap;
    }
    a.p-title:hover { color: var(--accent); }
    a.p-title i { font-size: 12px; color: var(--text-2); }
    .project p { color: var(--text-2); font-size: 14px; flex: 1; }
    .p-tags { display: flex; flex-wrap: wrap; gap: 8px; }
    .p-tags span {
      font-family: var(--mono); font-size: 11.5px;
      background: var(--bg); border: 1px solid var(--line);
      border-radius: 6px; padding: 2px 10px; color: var(--text-2);
    }
    .p-links { display: flex; gap: 8px; margin-top: 2px; }
    .p-links a {
      font-family: var(--mono);
      color: var(--text-2); font-size: 12.5px; text-decoration: none;
      padding: 5px 14px; border-radius: 8px; border: 1px solid var(--line);
      transition: all .25s; background: var(--bg);
    }
    .p-links a:hover { color: #fff; background: var(--accent); border-color: var(--accent); }
    .p-links i { margin-right: 5px; }

    /* ---------- 联系方式 ---------- */
    .contacts-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px; }
    .contact {
      background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
      padding: 22px; display: flex; align-items: center; gap: 16px;
      text-decoration: none; color: var(--text);
      height: 118px;
      transition: transform .3s ease, border-color .3s ease, box-shadow .3s ease;
    }
    .contact:hover { transform: translateY(-4px); border-color: color-mix(in srgb, var(--accent) 45%, transparent); box-shadow: var(--glow); }
    .c-icon {
      width: 48px; height: 48px; border-radius: 12px; flex-shrink: 0;
      background: var(--grad); color: #fff; font-size: 20px;
      display: flex; align-items: center; justify-content: center;
    }
    .c-label { font-size: 12.5px; color: var(--text-2); }
    .c-value { font-size: 15px; font-weight: 600; word-break: break-all; }

    /* ---------- 页脚 ---------- */
    footer { border-top: 1px solid var(--line); padding: 30px 0; text-align: center; color: var(--text-2); font-size: 13px; font-family: var(--mono); }

    /* ---------- 加载与错误 ---------- */
    #status { text-align: center; padding: 140px 24px; color: var(--text-2); }
    #status .spinner {
      width: 38px; height: 38px; border: 3px solid var(--line); border-top-color: var(--accent);
      border-radius: 50%; margin: 0 auto 16px; animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #status.error .spinner { display: none; }
    #status .err-box {
      text-align: left; max-width: 560px; margin: 0 auto;
      background: #1c1420; border: 1px solid #4a2434; border-radius: 14px; padding: 20px 24px;
    }
    #status .err-box code { background: rgba(255,255,255,.07); padding: 2px 6px; border-radius: 5px; font-size: 13px; }

    /* ---------- 入场动画 ---------- */
    @media (prefers-reduced-motion: no-preference) {
      .reveal { animation: rise .7s ease both; }
      .reveal:nth-child(2) { animation-delay: .08s; }
      .reveal:nth-child(3) { animation-delay: .16s; }
      .reveal:nth-child(4) { animation-delay: .24s; }
      @keyframes rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
    }

    /* ---------- 移动端适配 ---------- */
    @media (max-width: 640px) {
      .container { padding: 0 18px; }
      nav { height: 56px; }
      nav .logo { font-size: 15px; }
      nav ul a { font-size: 13px; padding: 4px 10px; }
      .hero { padding: 48px 0 28px; }
      .avatar-ring { width: 110px; height: 110px; }
      .avatar-ring .avatar-fallback { font-size: 38px; }
      section { padding: 32px 0; }
      .projects-grid, .contacts-grid { grid-template-columns: 1fr; }
      .contact { padding: 18px; }
    }
  </style>
</head>
<body>

  <header>
    <div class="container">
      <nav>
        <a class="logo" href="#" id="nav-logo">MyPage</a>
        <ul>
          <li><a href="#about">关于我</a></li>
          <li><a href="#projects">项目</a></li>
          <li><a href="#contact">联系我</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <div id="status">
    <div class="spinner"></div>
    <p>正在加载配置…</p>
  </div>

  <main id="app" style="display:none">
    <!-- 关于我 -->
    <section id="about">
      <div class="container hero reveal" id="hero"></div>
    </section>

    <!-- 项目 -->
    <section id="projects">
      <div class="container">
        <div class="section-title reveal">
          <div class="st-icon"><i class="fa-solid fa-rocket"></i></div>
          <h2>项目展示</h2>
          <div class="st-line"></div>
        </div>
        <div class="projects-grid" id="projects-grid"></div>
      </div>
    </section>

    <!-- 联系方式 -->
    <section id="contact">
      <div class="container">
        <div class="section-title reveal">
          <div class="st-icon"><i class="fa-solid fa-paper-plane"></i></div>
          <h2>联系我</h2>
          <div class="st-line"></div>
        </div>
        <div class="contacts-grid" id="contacts-grid"></div>
      </div>
    </section>
  </main>

  <footer style="display:none" id="footer"><div class="container" id="footer-text"></div></footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>
  <script>
    const escapeHtml = (s) =>
      String(s ?? '').replace(/[&<>"']/g, c =>
        ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

    // 图标渲染：fa- 开头用 Font Awesome，否则按 emoji / 文字处理
    const iconHtml = (icon, cls = '') =>
      !icon ? '' :
      icon.trim().startsWith('fa')
        ? `<i class="${escapeHtml(icon)} ${cls}"></i>`
        : `<span class="${cls}" style="font-size:1.15em">${escapeHtml(icon)}</span>`;

    function render(cfg) {
      const site = cfg.site || {};
      const profile = cfg.profile || {};
      const projects = cfg.projects || [];
      const contacts = cfg.contacts || [];

      // 主题色：accent 为主色
      if (site.accent) {
        document.documentElement.style.setProperty('--accent', site.accent);
      }

      // 标题 / 导航 logo / 页脚
      if (site.title) document.title = site.title;
      if (site.title) {
        document.getElementById('nav-logo').textContent = site.title;
      }

      // Hero 区
      const name = profile.name || 'My Page';
      const avatar = profile.avatar;
      let avatarHtml = '';
      if (avatar) {
        avatarHtml = `
          <div class="avatar-ring"><img src="${escapeHtml(avatar)}" alt="avatar"
            onerror="this.outerHTML='<div class=avatar-fallback>${escapeHtml(name.charAt(0))}</div>'"></div>`;
      } else {
        avatarHtml = `<div class="avatar-ring"><div class="avatar-fallback">${escapeHtml(name.charAt(0))}</div></div>`;
      }
      document.getElementById('hero').innerHTML = `
        ${avatarHtml}
        <h1>${escapeHtml(name)} <span class="wave">👋</span></h1>
        ${profile.title ? `<div class="job-pill"><i class="fa-solid fa-code"></i>${escapeHtml(profile.title)}</div>` : ''}
        ${profile.location ? `<div class="location"><i class="fa-solid fa-location-dot"></i>${escapeHtml(profile.location)}</div>` : ''}
        ${site.slogan ? `<div style="margin-top:10px;color:var(--text-2)">${escapeHtml(site.slogan)}</div>` : ''}
        ${profile.bio ? `<p class="bio">${escapeHtml(profile.bio)}</p>` : ''}
        ${(profile.skills || []).length ? `<div class="skills">${profile.skills
          .map(s => `<span class="skill">${escapeHtml(s)}</span>`).join('')}</div>` : ''}
      `;

      // 项目区 —— 卡片本身是 div，避免 a 嵌套 a 导致布局错乱
      const grid = document.getElementById('projects-grid');
      grid.innerHTML = projects.map(p => {
        const name = p.name || '未命名项目';
        const titleHtml = p.link
          ? `<a class="p-title" href="${escapeHtml(p.link)}" target="_blank" rel="noopener">${escapeHtml(name)}<i class="fa-solid fa-arrow-up-right-from-square"></i></a>`
          : `<span class="p-title">${escapeHtml(name)}</span>`;
        return `<div class="project reveal">
          <div class="p-head">
            <div class="p-icon">${iconHtml(p.icon || 'fa-solid fa-cube')}</div>
            ${titleHtml}
          </div>
          <p>${escapeHtml(p.description || '')}</p>
          ${(p.tags || []).length ? `<div class="p-tags">${p.tags
            .map(t => `<span>${escapeHtml(t)}</span>`).join('')}</div>` : ''}
          ${(p.link || p.repo) ? `<div class="p-links">
            ${p.link ? `<a href="${escapeHtml(p.link)}" target="_blank" rel="noopener"><i class="fa-solid fa-arrow-up-right-from-square"></i>在线访问</a>` : ''}
            ${p.repo ? `<a href="${escapeHtml(p.repo)}" target="_blank" rel="noopener"><i class="fa-brands fa-github"></i>源码</a>` : ''}
          </div>` : ''}
        </div>`;
      }).join('') || '<p style="color:var(--text-2)">暂无项目，请在 config.yml 中添加。</p>';

      // 联系方式区（卡片可整体点击，且内部无嵌套链接）
      document.getElementById('contacts-grid').innerHTML = contacts.map(c => {
        const inner = `
          <div class="c-icon">${iconHtml(c.icon || 'fa-solid fa-link')}</div>
          <div>
            <div class="c-label">${escapeHtml(c.label || '')}</div>
            <div class="c-value">${escapeHtml(c.value || '')}</div>
          </div>`;
        return c.link
          ? `<a class="contact reveal" href="${escapeHtml(c.link)}" target="_blank" rel="noopener">${inner}</a>`
          : `<div class="contact reveal">${inner}</div>`;
      }).join('') || '<p style="color:var(--text-2)">暂无联系方式，请在 config.yml 中添加。</p>';

      // 页脚
      document.getElementById('footer-text').textContent = site.footer || '';
      document.getElementById('footer').style.display = '';

      // 显示页面
      document.getElementById('status').style.display = 'none';
      document.getElementById('app').style.display = '';
    }

    function showError(err) {
      const el = document.getElementById('status');
      el.className = 'error';
      el.innerHTML = `
        <div class="err-box">
          <p><strong>⚠️ 配置文件加载失败</strong></p>
          <p style="margin-top:8px">无法读取 <code>config.yml</code>。常见原因：</p>
          <p>1. 直接双击打开 HTML 文件（file:// 协议受浏览器安全限制，无法 fetch 本地文件）。<br>
             请使用本地服务器预览，例如在项目目录运行：<br>
             <code>python -m http.server 8000</code><br>
             然后访问 <code>http://localhost:8000</code></p>
          <p style="margin-top:8px">2. 部署到 GitHub Pages 后此问题不会出现。</p>
          <p style="margin-top:8px;color:var(--text-2)">详细错误：${escapeHtml(err && err.message || err)}</p>
        </div>`;
    }

    fetch('config.yml', { cache: 'no-store' })
      .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
      .then(text => jsyaml.load(text))
      .then(cfg => { if (!cfg) throw new Error('config.yml 为空'); render(cfg); })
      .catch(showError);
  </script>
</body>
</html>
