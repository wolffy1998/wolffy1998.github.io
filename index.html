<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wolffy1998 - 个人主页</title>
  <meta name="description" content="Wolffy1998 的个人主页 - 展示项目与作品">
  <link rel="stylesheet" href="css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
  <!-- 导航栏 -->
  <nav class="navbar">
    <div class="container">
      <a href="#home" class="nav-logo">Wolffy1998</a>
      <button class="nav-toggle" aria-label="切换导航菜单">
        <span></span><span></span><span></span>
      </button>
      <ul class="nav-menu">
        <li><a href="#home" class="nav-link">首页</a></li>
        <li><a href="#projects" class="nav-link">项目</a></li>
      </ul>
    </div>
  </nav>

  <!-- 首页 -->
  <section id="home" class="hero">
    <div class="container">
      <div class="hero-content">
        <div class="hero-avatar">
          <!-- 自定义：替换下方 src 为你的头像图片链接 -->
          <img src="https://raw.githubusercontent.com/wolffy1998/wolffy1998.github.io/main/assets/touxiang.jpg" alt="Wolffy1998 头像">
        </div>
        <h1 class="hero-title">你好，我是 <span class="highlight">Wolffy1998</span></h1>
        <p class="hero-subtitle">开发者 · 创作者 · 开源爱好者</p>
        <p class="hero-description">
          欢迎来到我的个人空间。在这里你可以找到我的项目、开源贡献以及与我取得联系的方式。
        </p>
      </div>
    </div>
    <div class="hero-bg"></div>
  </section>

  <!-- 项目展示 -->
  <section id="projects" class="projects">
    <div class="container">
      <h2 class="section-title">我的项目</h2>
      <p class="section-subtitle">我构建和参与的部分项目</p>

      <div class="projects-grid">
        <!--
          自定义项目卡片：
          1. 复制下方整个 project-card div 可添加更多项目
          2. 修改项目图标（fas fa-xxx 可替换为其他图标，见 https://fontawesome.com/icons ）
          3. 修改项目名称和描述
          4. 修改技术标签文字
          5. 修改 GitHub 链接和演示链接
        -->

        <!-- 项目卡片 1 -->
        <div class="project-card">
          <div class="project-icon">
            <i class="fas fa-code"></i>
          </div>
          <h3 class="project-title">MAME-SL-GameList 编辑器</h3>
          <p class="project-description">
            MAME 模拟器家用机游戏列表汉化工具。
          </p>
          <div class="project-tags">
            <span class="tag">HTML</span>
            <span class="tag">JavaScript</span>
          </div>
          <div class="project-links">
            <a href="https://wolffy1998.github.io/MAME-SL-GameList/" target="_blank" rel="noopener">
              <i class="fab fa-github"></i> 源代码
            </a>
            <a href="#" target="_blank" rel="noopener">
              <i class="fas fa-external-link-alt"></i> 演示
            </a>
          </div>
        </div>

        <!-- 项目卡片 2 -->
        <div class="project-card">
          <div class="project-icon">
            <i class="fas fa-mobile-alt"></i>
          </div>
          <h3 class="project-title">项目 Beta</h3>
          <p class="project-description">
            在这里描述你的第二个项目。突出核心功能和使用的技术栈。
          </p>
          <div class="project-tags">
            <span class="tag">React</span>
            <span class="tag">Node.js</span>
          </div>
          <div class="project-links">
            <a href="https://github.com/wolffy1998/project-beta" target="_blank" rel="noopener">
              <i class="fab fa-github"></i> 源代码
            </a>
          </div>
        </div>

    </div>
  </section>

  <!-- 页脚 -->
  <footer class="footer">
    <div class="container">
      <p>&copy; 2024-<span id="current-year"></span> Wolffy1998. 托管于 GitHub Pages。</p>
    </div>
  </footer>

  <script src="js/main.js"></script>
</body>
</html>
