<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>个人主页</title>
  <meta name="description" content="个人主页 - 关于我、项目与联系方式" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  <style>
    :root {
      --accent: #4f6ef7;
      --bg: #f5f7fb;
      --card: #ffffff;
      --text: #1f2430;
      --text-2: #5b6472;
      --line: #e6e9f0;
      --radius: 16px;
      --shadow: 0 4px 20px rgba(31, 36, 48, 0.06);
      --shadow-hover: 0 10px 30px rgba(31, 36, 48, 0.12);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      font-family: "PingFang SC", "Microsoft YaHei", "Segoe UI", -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
    }
    .container { max-width: 960px; margin: 0 auto; padding: 0 24px; }

    /* ---------- 顶部导航 ---------- */
    header {
      position: sticky; top: 0; z-index: 10;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--line);
    }
    nav { display: flex; align-items: center; justify-content: space-between; height: 60px; }
    nav .logo { font-weight: 700; font-size: 18px; color: var(--text); text-decoration: none; }
    nav .logo span { color: var(--accent); }
    nav ul { display: flex; gap: 28px; list-style: none; }
    nav ul a { color: var(--text-2); text-decoration: none; font-size: 15px; transition: color .2s; }
    nav ul a:hover { color: var(--accent); }

    /* ---------- Hero ---------- */
    .hero { padding: 72px 0 56px; text-align: center; }
    .avatar {
      width: 120px; height: 120px; border-radius: 50%;
      object-fit: cover;
      border: 4px solid #fff;
      box-shadow: var(--shadow-hover);
      background: var(--accent);
      color: #fff; font-size: 44px; font-weight: 700;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 20px;
      user-select: none;
    }
    .hero h1 { font-size: 34px; letter-spacing: 1px; }
    .hero h1 .wave { display: inline-block; animation: wave 2.2s infinite; transform-origin: 70% 70%; }
    .hero .job { color: var(--accent); font-weight: 600; margin: 6px 0 4px; }
    .hero .location { color: var(--text-2); font-size: 14px; }
    .hero .location i { margin-right: 4px; }
    .hero .bio {
      max-width: 620px; margin: 18px auto 0;
      color: var(--text-2); white-space: pre-line;
    }
    .skills { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 24px; }
    .skill {
      background: #fff; border: 1px solid var(--line); border-radius: 999px;
      padding: 5px 16px; font-size: 13px; color: var(--text-2);
      transition: all .2s;
    }
    .skill:hover { border-color: var(--accent); color: var(--accent); transform: translateY(-2px); }
    @keyframes wave { 0%,60%,100% { transform: rotate(0); } 10%,30% { transform: rotate(16deg); } 20% { transform: rotate(-6deg); } }

    /* ---------- 区块 ---------- */
    section { padding: 40px 0; }
    .section-title { display: flex; align-items: center; gap: 12px; margin-bottom: 28px; }
    .section-title i {
      width: 40px; height: 40px; border-radius: 12px;
      background: var(--accent); color: #fff; font-size: 17px;
      display: flex; align-items: center; justify-content: center;
    }
    .section-title h2 { font-size: 22px; }

    /* ---------- 项目卡片 ---------- */
    .projects-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
    .project {
      background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
      padding: 24px; text-decoration: none; color: var(--text);
      display: flex; flex-direction: column; gap: 10px;
      transition: all .25s ease; position: relative; overflow: hidden;
    }
    .project:hover { transform: translateY(-4px); box-shadow: var(--shadow-hover); border-color: transparent; text-decoration: none; }
    .project.highlight { border-color: var(--accent); }
    .project .p-head { display: flex; align-items: center; gap: 12px; }
    .project .p-icon {
      width: 44px; height: 44px; border-radius: 12px; flex-shrink: 0;
      background: color-mix(in srgb, var(--accent) 12%, white);
      color: var(--accent); font-size: 19px;
      display: flex; align-items: center; justify-content: center;
    }
    .project h3 { font-size: 17px; }
    .project .p-badge {
      position: absolute; top: 14px; right: -30px; transform: rotate(45deg);
      background: var(--accent); color: #fff; font-size: 11px;
      padding: 2px 34px;
    }
    .project p { color: var(--text-2); font-size: 14px; flex: 1; }
    .project .p-tags { display: flex; flex-wrap: wrap; gap: 8px; }
    .project .p-tags span {
      background: var(--bg); border-radius: 6px; padding: 2px 10px;
      font-size: 12px; color: var(--text-2);
    }
    .project .p-links { display: flex; gap: 16px; margin-top: 4px; }
    .project .p-links a { color: var(--text-2); font-size: 13px; text-decoration: none; transition: color .2s; }
    .project .p-links a:hover { color: var(--accent); }
    .project .p-links i { margin-right: 5px; }

    /* ---------- 联系方式 ---------- */
    .contacts-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 16px; }
    .contact {
      background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
      padding: 20px; display: flex; align-items: center; gap: 14px;
      text-decoration: none; color: var(--text); transition: all .25s;
    }
    .contact:hover { transform: translateY(-3px); box-shadow: var(--shadow-hover); border-color: transparent; }
    .contact .c-icon {
      width: 46px; height: 46px; border-radius: 50%; flex-shrink: 0;
      background: color-mix(in srgb, var(--accent) 12%, white);
      color: var(--accent); font-size: 20px;
      display: flex; align-items: center; justify-content: center;
    }
    .contact .c-label { font-size: 13px; color: var(--text-2); }
    .contact .c-value { font-size: 15px; font-weight: 600; word-break: break-all; }

    /* ---------- 页脚 ---------- */
    footer { border-top: 1px solid var(--line); padding: 28px 0; text-align: center; color: var(--text-2); font-size: 13px; }

    /* ---------- 加载与错误 ---------- */
    #status { text-align: center; padding: 120px 24px; color: var(--text-2); }
    #status .spinner {
      width: 36px; height: 36px; border: 3px solid var(--line); border-top-color: var(--accent);
      border-radius: 50%; margin: 0 auto 16px; animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #status.error .spinner { display: none; }
    #status .err-box { text-align: left; max-width: 560px; margin: 0 auto; background: #fff3f3; border: 1px solid #ffd6d6; border-radius: 12px; padding: 20px 24px; }
    #status .err-box code { background: #ffeaea; padding: 2px 6px; border-radius: 4px; font-size: 13px; }

    @media (max-width: 640px) {
      nav ul { gap: 18px; }
      .hero { padding: 48px 0 40px; }
      .hero h1 { font-size: 27px; }
    }
  </style>
</head>
<body>

  <header>
    <div class="container">
      <nav>
        <a class="logo" href="#" id="nav-logo">My<span>Page</span></a>
        <ul>
          <li><a href="#about">关于我</a></li>
          <li><a href="#projects">项目</a></li>
          <li><a href="#contact">联系我</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <div id="status">
    <div class="spinner"></div>
    <p>正在加载配置…</p>
  </div>

  <main id="app" style="display:none">
    <!-- 关于我 -->
    <section id="about">
      <div class="container hero" id="hero"></div>
    </section>

    <!-- 项目 -->
    <section id="projects">
      <div class="container">
        <div class="section-title">
          <i class="fa-solid fa-rocket"></i>
          <h2>项目展示</h2>
        </div>
        <div class="projects-grid" id="projects-grid"></div>
      </div>
    </section>

    <!-- 联系方式 -->
    <section id="contact">
      <div class="container">
        <div class="section-title">
          <i class="fa-solid fa-paper-plane"></i>
          <h2>联系我</h2>
        </div>
        <div class="contacts-grid" id="contacts-grid"></div>
      </div>
    </section>
  </main>

  <footer style="display:none" id="footer"><div class="container" id="footer-text"></div></footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>
  <script>
    const escapeHtml = (s) =>
      String(s ?? '').replace(/[&<>"']/g, c =>
        ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

    // 图标渲染：fa- 开头用 Font Awesome，否则按 emoji / 文字处理
    const iconHtml = (icon, cls = '') =>
      !icon ? '' :
      icon.trim().startsWith('fa')
        ? `<i class="${escapeHtml(icon)} ${cls}"></i>`
        : `<span class="${cls}" style="font-size:1.15em">${escapeHtml(icon)}</span>`;

    function render(cfg) {
      const site = cfg.site || {};
      const profile = cfg.profile || {};
      const projects = cfg.projects || [];
      const contacts = cfg.contacts || [];

      // 主题色
      if (site.accent) {
        document.documentElement.style.setProperty('--accent', site.accent);
      }

      // 标题 / 导航 logo / 页脚
      if (site.title) document.title = site.title;
      if (site.title) {
        document.getElementById('nav-logo').innerHTML =
          escapeHtml(site.title).replace(/(.)(.*)$/, '$1<span>$2</span>');
      }

      // Hero 区
      const name = profile.name || 'My Page';
      const avatar = profile.avatar;
      let avatarHtml = '';
      if (avatar) {
        avatarHtml = `<img class="avatar" src="${escapeHtml(avatar)}" alt="avatar"
          onerror="this.outerHTML='<div class=avatar>${escapeHtml(name.charAt(0))}</div>'">`;
      } else {
        avatarHtml = `<div class="avatar">${escapeHtml(name.charAt(0))}</div>`;
      }
      document.getElementById('hero').innerHTML = `
        ${avatarHtml}
        <h1>${escapeHtml(name)} <span class="wave">👋</span></h1>
        ${profile.title ? `<div class="job">${escapeHtml(profile.title)}</div>` : ''}
        ${profile.location ? `<div class="location"><i class="fa-solid fa-location-dot"></i>${escapeHtml(profile.location)}</div>` : ''}
        ${site.slogan ? `<div style="margin-top:6px;color:var(--text-2)">${escapeHtml(site.slogan)}</div>` : ''}
        ${profile.bio ? `<p class="bio">${escapeHtml(profile.bio)}</p>` : ''}
        ${(profile.skills || []).length ? `<div class="skills">${profile.skills
          .map(s => `<span class="skill">${escapeHtml(s)}</span>`).join('')}</div>` : ''}
      `;

      // 项目区
      const grid = document.getElementById('projects-grid');
      grid.innerHTML = projects.map(p => {
        const name = p.name || '未命名项目';
        const link = p.link || p.repo || null;
        const inner = `
          ${p.highlight ? '<div class="p-badge">推荐</div>' : ''}
          <div class="p-head">
            <div class="p-icon">${iconHtml(p.icon || 'fa-solid fa-cube')}</div>
            <h3>${escapeHtml(name)}</h3>
          </div>
          <p>${escapeHtml(p.description || '')}</p>
          ${(p.tags || []).length ? `<div class="p-tags">${p.tags
            .map(t => `<span>${escapeHtml(t)}</span>`).join('')}</div>` : ''}
          ${(p.link || p.repo) ? `<div class="p-links">
            ${p.link ? `<a href="${escapeHtml(p.link)}" target="_blank" rel="noopener"><i class="fa-solid fa-arrow-up-right-from-square"></i>在线访问</a>` : ''}
            ${p.repo ? `<a href="${escapeHtml(p.repo)}" target="_blank" rel="noopener"><i class="fa-brands fa-github"></i>源码</a>` : ''}
          </div>` : ''}
        `;
        return link
          ? `<a class="project ${p.highlight ? 'highlight' : ''}" href="${escapeHtml(link)}" target="_blank" rel="noopener">${inner}</a>`
          : `<div class="project ${p.highlight ? 'highlight' : ''}">${inner}</div>`;
      }).join('') || '<p style="color:var(--text-2)">暂无项目，请在 config.yml 中添加。</p>';

      // 联系方式区
      document.getElementById('contacts-grid').innerHTML = contacts.map(c => {
        const inner = `
          <div class="c-icon">${iconHtml(c.icon || 'fa-solid fa-link')}</div>
          <div>
            <div class="c-label">${escapeHtml(c.label || '')}</div>
            <div class="c-value">${escapeHtml(c.value || '')}</div>
          </div>`;
        return c.link
          ? `<a class="contact" href="${escapeHtml(c.link)}" target="_blank" rel="noopener">${inner}</a>`
          : `<div class="contact">${inner}</div>`;
      }).join('') || '<p style="color:var(--text-2)">暂无联系方式，请在 config.yml 中添加。</p>';

      // 页脚
      document.getElementById('footer-text').textContent = site.footer || '';
      document.getElementById('footer').style.display = '';

      // 显示页面
      document.getElementById('status').style.display = 'none';
      document.getElementById('app').style.display = '';
    }

    function showError(err) {
      const el = document.getElementById('status');
      el.className = 'error';
      el.innerHTML = `
        <div class="err-box">
          <p><strong>⚠️ 配置文件加载失败</strong></p>
          <p style="margin-top:8px">无法读取 <code>config.yml</code>。常见原因：</p>
          <p>1. 直接双击打开 HTML 文件（file:// 协议受浏览器安全限制，无法 fetch 本地文件）。<br>
             请使用本地服务器预览，例如在项目目录运行：<br>
             <code>python -m http.server 8000</code><br>
             然后访问 <code>http://localhost:8000</code></p>
          <p style="margin-top:8px">2. 部署到 GitHub Pages 后此问题不会出现。</p>
          <p style="margin-top:8px;color:var(--text-2)">详细错误：${escapeHtml(err && err.message || err)}</p>
        </div>`;
    }

    fetch('config.yml')
      .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
      .then(text => jsyaml.load(text))
      .then(cfg => { if (!cfg) throw new Error('config.yml 为空'); render(cfg); })
      .catch(showError);
  </script>
</body>
</html>
